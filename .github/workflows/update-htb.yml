name: Update HTB Profile Card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate HTB card
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: python scripts/update_htb_card.py

      - name: Commit card if changed
        run: |
          if git diff --quiet -- assets/htb-card.svg; then
            echo "HTB card is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/htb-card.svg
          git commit -m "chore: update HTB profile card"
          git push
